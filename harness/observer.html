('switch').textContent=w('switch');$('switchNote').textContent=w('switchNote');$('route').textContent=t.routing?`${w('pending')}: ${t.routing.provider} / ${t.routing.model||w('default')}`:'';$('intervene').textContent=w('intervene');for(const k of ['send','pause','continue'])$(k).textContent=w(k);$('historyTitle').textContent=w('history');replace('history',t.events.map(e=>{const d=el('div',undefined,'event');d.append(el('small',new Date(e.at).toLocaleTimeString(lang)),el('p',names[e.kind]?.[1]||e.kind));if(e.note)d.append(el('small',e.note));return d}));$('send').disabled=busy||!connected||!$('feedback').value.trim();$('switch').disabled=busy||!connected;$('pause').disabled=busy||!connected||t.pause_requested||['completed','already_satisfied','stale'].includes(t.status);$('continue').disabled=busy||!connected||!t.pause_requested;}
async function poll(){try{const r=await fetch('/state',{headers:{'X-Harness-Token':token},cache:'no-store'});if(!r.ok)throw Error(r.status);data=await r.json();connected=true}catch{connected=false}render()}
async function action(path){const t=current();if(!t||busy)return;busy=true;renderDetail();try{const r=await fetch(path,{method:'POST',headers:{'X-Harness-Token':token,'Content-Type':'application/json'},body:JSON.stringify({task_id:t.id,revision:path==='/feedback'?draftRevision:t.revision,text:$('feedback').value,provider:$('provider').value,model:$('model').value.trim()})});const result=await r.json();if(!r.ok){if(r.status===409){draftRevision=t.revision;throw Error(w('changed'))}throw Error(result.error||r.status)}if(path==='/feedback'){$('feedback').value='';draftRevision=null}$('notice').textContent=w(result.worker_running?'saved':'waiting')}catch(e){$('notice').textContent=e.message}finally{busy=false;await poll()}}
$('close').onclick=()=>$('drawer').close();$('lang').onchange=()=>{lang=$('lang').value;signature='';render()};$('feedback').oninput=()=>{if(draftRevision===null)draftRevision=current()?.revision;$('send').disabled=!$('feedback').value.trim()||busy||!connected};$('send').onclick=()=>action('/feedback');$('pause').onclick=()=>action('/pause');$('continue').onclick=()=>action('/continue');$('switch').onclick=()=>action('/switch');(async()=>{await poll();setTimeout(async function tick(){await poll();setTimeout(tick,2000)},2000)})();
</script></html>
