<!doctype html>
<html lang="__LANG__"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Local Harness · Observer</title>
<style>
:root{color-scheme:dark;--bg:#101615;--panel:#19211f;--line:#303e39;--muted:#a0b3a9;--mint:#b8f6cf;--amber:#ffcc83}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef5f0;font:14px/1.6 system-ui,sans-serif}header{padding:25px 32px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:19px;letter-spacing:2px;margin:0}h2{font-size:25px;line-height:1.45;margin:12px 0}h3{font-size:12px;letter-spacing:1px;color:var(--muted);margin:0 0 14px}p{margin:8px 0}small,.muted{color:var(--muted)}button,select,textarea{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px}button{cursor:pointer}button:hover,button:focus-visible{border-color:var(--mint)}button:disabled{opacity:.45;cursor:default}.primary{background:var(--mint);color:#123222;font-weight:650}.badge{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:3px 11px;font-size:12px;color:var(--mint)}.warn{color:var(--amber)}#summary{padding:18px 32px;display:flex;gap:24px;border-bottom:1px solid var(--line);flex-wrap:wrap}main{display:grid;grid-template-columns:290px minmax(0,1fr);max-width:1500px;margin:auto;min-height:75vh}aside{padding:22px 18px;border-right:1px solid var(--line)}#tasks{display:grid;gap:8px;margin-top:16px}.task{text-align:left;width:100%;padding:15px}.task.selected{background:#283c31;border-color:#6b997b}.task strong{display:block;font-weight:500;margin:7px 0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.task small{font-size:11px}article{padding:28px 32px;min-width:0}.grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(270px,1fr);gap:20px;margin-top:25px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:20px;margin-bottom:18px}.session{border-left:2px solid var(--mint);padding:9px 12px;background:#111b16;margin:10px 0;border-radius:0 8px 8px 0}.mono{font:11px/1.7 ui-monospace,monospace;overflow-wrap:anywhere}.event{padding:12px 0;border-bottom:1px solid var(--line)}.event:last-child{border:0}.event p{font-size:13px;overflow-wrap:anywhere}.event small{font-size:11px}textarea{width:100%;min-height:110px;resize:vertical;background:var(--bg)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}#notice{min-height:25px;white-space:pre-wrap}#scope{font-size:12px}#workspace{overflow-wrap:anywhere}.message{padding:12px;border-left:2px solid #859bc4;margin:10px 0;background:#131a20}.empty{padding:60px 20px;color:var(--muted)}[hidden]{display:none!important}details{margin-top:14px}summary{cursor:pointer;color:var(--muted)}#connection{margin-right:14px}#draftWarning{color:var(--amber)}:focus-visible{outline:2px solid var(--mint);outline-offset:3px}@media(max-width:1000px){.grid{grid-template-columns:1fr}main{grid-template-columns:240px minmax(0,1fr)}article{padding:22px}}@media(max-width:680px){main{display:block}aside{border-right:0;border-bottom:1px solid var(--line)}#tasks{max-height:250px;overflow:auto}header,#summary{padding:18px}header{align-items:flex-start}h2{font-size:21px}}
</style>
<header><div><h1>LOCAL HARNESS <span class="muted">/ OBSERVER</span></h1><div id="scope"></div></div><div><span id="connection" role="status"></span><select id="language" aria-label="Language"><option value="ko">한국어</option><option value="en">English</option></select></div></header>
<div id="summary"></div><main><aside><select id="filter" aria-label="Task filter"></select><div id="tasks"></div></aside><article><div id="empty" class="empty"></div><div id="detail" hidden><span id="status" class="badge"></span><h2 id="goal"></h2><div id="workspace" class="muted mono"></div><div class="grid"><div><section class="panel"><h3 id="sessionHeading"></h3><div id="sessions"></div><small id="sessionNote"></small></section><section class="panel"><h3 id="resultHeading"></h3><div id="reason" class="warn"></div><div id="checks"></div><details><summary id="contractHeading"></summary><div id="contract"></div></details></section><section class="panel"><h3 id="messageHeading"></h3><div id="messages"></div></section></div><div><section class="panel"><h3 id="interveneHeading"></h3><div id="pending" class="muted"></div><label for="feedback" id="feedbackLabel"></label><textarea id="feedback" maxlength="24000"></textarea><div id="draftWarning"></div><div class="actions"><button id="send" class="primary"></button><button id="pause"></button><button id="continue"></button></div><small id="controlNote"></small><p id="notice" role="status"></p></section><section class="panel"><h3 id="eventHeading"></h3><div id="events"></div></section></div></div></div></article></main>
<script nonce="__TOKEN__">
'use strict';
const token='__TOKEN__', $=id=>document.getElementById(id);
let lang='__LANG__', data=null, selected=null, draftRevision=null, sending=false, connected=false;
const words={ko:{scope:'하네스 관리 세션만 표시 · 외부 세션은 조회하지 않음',live:'● 연결됨',offline:'○ 연결 끊김 · 마지막 수신 정보',all:'전체 작업',attention:'개입 필요',active:'실행 중',verified:'검증 완료',worker:'워커',on:'실행 중',off:'미실행',sessions:'관리 세션',sessionNote:'실행 상태는 하네스의 작업 잠금과 호출 기록 기준입니다. 외부 CLI 세션은 포함하지 않습니다.',results:'완료 근거',contract:'목적의 조건과 계획',messages:'세션 간 대화',noMessages:'아직 세션 간 대화가 없습니다.',intervene:'작업에 개입',feedback:'추가 지시 또는 수정할 목적',send:'피드백 보내기',pause:'일시정지',continue:'계속 진행',controlNote:'정지는 현재 호출·파일 적용이 끝난 안전한 경계에서 반영됩니다. 계속 진행과 피드백은 워커가 처리합니다.',events:'최근 상태 변화',empty:'등록된 작업이 없습니다. harness start로 작업을 시작하세요.',pending:'처리 대기 피드백',noChecks:'아직 검증 결과가 없습니다.',saved:'저장했습니다. 다음 안전한 경계에서 처리합니다.',waiting:'저장했습니다. 워커를 실행하면 처리됩니다: harness worker',changed:'작성 중 작업이 변경됐습니다. 최신 상태를 확인한 뒤 다시 보내세요.',review:'최신 상태 확인',failed:'요청 실패',peer:'협의',owner:'실행',queued:'대기',in_flight:'답변 요청 중',answered:'답변 수신',consumed:'작업에 전달됨'},en:{scope:'Managed sessions only · External sessions are not scanned',live:'● Connected',offline:'○ Disconnected · Last received state',all:'All tasks',attention:'Needs attention',active:'Executing',verified:'Verified',worker:'Worker',on:'online',off:'offline',sessions:'MANAGED SESSIONS',sessionNote:'Activity reflects runtime locks and call records. External CLI sessions are not included.',results:'COMPLETION EVIDENCE',contract:'Constraints and plan',messages:'SESSION CONVERSATIONS',noMessages:'No session conversations yet.',intervene:'INTERVENE',feedback:'Further instructions or a corrected goal',send:'Send feedback',pause:'Pause',continue:'Continue',controlNote:'Pause takes effect at a safe boundary after the current call or file application. A worker processes feedback and continuation.',events:'RECENT CHANGES',empty:'No registered tasks. Start one with harness start.',pending:'Queued feedback',noChecks:'No verification results yet.',saved:'Saved. Processing at the next safe boundary.',waiting:'Saved. Start the worker to process it: harness worker',changed:'Task changed while drafting. Review the latest state before sending again.',review:'Review latest state',failed:'Request failed',peer:'Adviser',owner:'Executor',queued:'Queued',in_flight:'Awaiting reply',answered:'Reply received',consumed:'Delivered to task'}};
const eventNames={received:['접수','Received'],model_started:['AI 호출 시작','AI call started'],model_finished:['AI 응답 수신','AI reply received'],contract_created:['목적·검증 조건 설정','Contract created'],baseline_recorded:['변경 전 상태 확인','Baseline recorded'],action_prepared:['변경 준비','Changes prepared'],verified:['결과 검증','Results verified'],completed:['검증 완료','Completed'],feedback_queued:['피드백 접수','Feedback queued'],feedback_applied:['피드백 반영','Feedback applied'],pause_requested:['정지 요청','Pause requested'],paused:['일시정지','Paused'],continue_requested:['재개 요청','Continuation requested'],continued:['재개','Continued'],message_queued:['협의 요청','Consultation queued'],automatic_checkpoint:['컨텍스트 정리','Context checkpoint'],action_applied:['변경 적용됨','Changes applied'],message_consumed:['답변을 작업에 전달','Reply delivered to task'],consultation_returned:['협의 후 작업 재개','Task resumed after consultation'],message_answered:['답변 기록','Reply recorded'],peer_response_received:['상대 응답 수신','Peer response received'],message_in_flight:['상대 세션 호출','Peer session called'],consultation_requested:['협의 대기','Awaiting consultation'],options_recorded:['실행 설정 저장','Execution options saved'],paused_at_boundary:['일시정지 반영','Paused at safe boundary']};
const w=key=>words[lang][key]||key, label=key=>data?.labels[lang][key]||w(key);
function node(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function fill(id,items){$(id).replaceChildren(...items)}
function current(){return data?.tasks.find(t=>t.id===selected)}
function choose(id){if(selected===id)return;if($('feedback').value.trim()){ $('notice').textContent=lang==='ko'?'작성 중인 피드백을 보내거나 지운 후 작업을 전환하세요.':'Send or clear the draft before switching tasks.';return }selected=id;draftRevision=null;$('notice').textContent='';render()}
function render(){
 document.documentElement.lang=lang;$('language').value=lang;$('scope').textContent=w('scope');$('connection').textContent=w(connected?'live':'offline');$('connection').className=connected?'':'warn';
 const filter=$('filter').value||'all';fill('filter',['all','attention','active'].map(k=>{const o=node('option',w(k));o.value=k;return o}));$('filter').value=filter;
 if(!data)return;
 fill('summary',[node('span',`${w('active')}  ${data.tasks.filter(t=>t.busy).length}`),node('span',`${w('attention')}  ${data.tasks.filter(t=>t.attention).length}`),node('span',`${w('verified')}  ${data.tasks.filter(t=>['completed','already_satisfied'].includes(t.status)).length}`),node('span',`${w('worker')} · ${w(data.worker_running?'on':'off')}`,data.worker_running?'':'warn'),node('small',`${data.tasks.length} / ${data.total} · ${new Date(data.at).toLocaleTimeString(lang)}`)]);
 if(!selected&&data.tasks.length)selected=data.tasks[0].id;
 fill('tasks',data.tasks.filter(t=>filter==='all'||(filter==='attention'?t.attention:t.busy)).map(t=>{const b=node('button',undefined,'task'+(selected===t.id?' selected':''));b.append(node('small',label(t.status),t.attention?'warn':''),node('strong',t.goal),node('small',`${t.provider} · ${t.id}`));b.onclick=()=>choose(t.id);return b}));
 const openedReplies=new Set(Array.from(document.querySelectorAll('#messages details[open]')).map(e=>e.id));
 const t=current();$('detail').hidden=!t;$('empty').hidden=!!t;$('empty').textContent=w('empty');if(!t)return;
 $('status').textContent=label(t.status);$('status').className='badge'+(t.attention?' warn':'');$('goal').textContent=t.goal;$('workspace').textContent=`${t.workspace} · ${t.id} · r${t.revision}`;
 for(const [id,key]of Object.entries({sessionHeading:'sessions',sessionNote:'sessionNote',resultHeading:'results',contractHeading:'contract',messageHeading:'messages',interveneHeading:'intervene',feedbackLabel:'feedback',send:'send',pause:'pause',continue:'continue',controlNote:'controlNote',eventHeading:'events'}))$(id).textContent=w(key);
 fill('sessions',t.sessions.map(s=>{const e=node('div',undefined,'session');e.append(node('div',`${s.name} · ${s.provider} · ${w(s.peer?'peer':'owner')}`),node('small',label(s.state)),node('div',s.id||'—','mono'));return e}));
 $('reason').textContent=[t.reason,...t.questions].filter(Boolean).join('\n');fill('checks',t.checks.length?t.checks.map(c=>node('p',`${c.passed?'✓':'!'} ${c.reason||c.path||JSON.stringify(c)}`,c.passed?'':'warn')):[node('p',w('noChecks'),'muted')]);fill('contract',[...t.constraints,...t.steps].map(x=>node('p',typeof x==='string'?x:JSON.stringify(x))));
 fill('messages',t.messages.length?t.messages.slice().reverse().map(m=>{const e=node('div',undefined,'message');e.append(node('small',`${m.target} · ${w(m.status)}`),node('p',m.question));if(m.reply){const d=node('details');d.id='reply-'+m.id;d.open=openedReplies.has(d.id);d.append(node('summary',lang==='ko'?'답변 보기':'Read reply'),node('p',m.reply));e.append(d)}if(m.error)e.append(node('p',m.error,'warn'));return e}):[node('p',w('noMessages'),'muted')]);
 $('pending').textContent=t.feedback.length?`${w('pending')}: ${t.feedback.length}`:'';
 const changed=draftRevision!==null&&draftRevision!==t.revision;
 $('draftWarning').textContent=changed?w('changed'):'';if(changed){const b=node('button',w('review'));b.onclick=()=>{draftRevision=t.revision;render()};$('draftWarning').append(b)}
 $('send').disabled=sending||!connected||changed||!$('feedback').value.trim();$('pause').disabled=sending||!connected||t.pause_requested||['completed','already_satisfied','stale'].includes(t.status);$('continue').disabled=sending||!connected||!t.pause_requested;
 fill('events',t.events.map(e=>{const el=node('div',undefined,'event');el.append(node('small',`${new Date(e.at).toLocaleTimeString(lang)} · ${eventNames[e.kind]?.[lang==='ko'?0:1]||e.kind}`));if(e.note)el.append(node('p',e.note));return el}));
}
async function poll(){try{const r=await fetch('/state',{headers:{'X-Harness-Token':token},cache:'no-store'});if(!r.ok)throw Error(r.status);data=await r.json();connected=true}catch{connected=false}render()}
async function act(path){const t=current();if(!t||sending||!connected)return;sending=true;render();try{const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Harness-Token':token},body:JSON.stringify({task_id:t.id,revision:path==='/feedback'?draftRevision:t.revision,text:$('feedback').value})});const result=await r.json();if(!r.ok)throw Error(r.status===409?w('changed'):(result.error||r.status));if(path==='/feedback'){$('feedback').value='';draftRevision=null}$('notice').textContent=w(result.worker_running?'saved':'waiting')}catch(e){$('notice').textContent=w('failed')+': '+e.message}finally{sending=false;await poll()}}
$('feedback').oninput=()=>{if(!$('feedback').value.trim())draftRevision=null;if(draftRevision===null)draftRevision=current()?.revision;render()};$('language').onchange=()=>{lang=$('language').value;render()};$('filter').onchange=render;$('send').onclick=()=>act('/feedback');$('pause').onclick=()=>act('/pause');$('continue').onclick=()=>act('/continue');
(async()=>{await poll();setTimeout(async function tick(){await poll();setTimeout(tick,2000)},2000)})();
</script></html>
