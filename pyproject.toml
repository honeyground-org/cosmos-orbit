[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "local-harness"
version = "0.1.0"
description = "A local, provider-neutral task runtime for Codex CLI and Claude Code"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools]
packages = ["harness"]

[tool.setuptools.package-data]
harness = ["observer.html"]
